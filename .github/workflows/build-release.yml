name: Build and push release

on:
  push:
    branches:
      - main

concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/reusable-tests.yml
    secrets:
      codecov_token: ${{ secrets.CODECOV_TOKEN }}

  build_docker:
    needs: tests
    uses: ./.github/workflows/reusable-docker.yml

  validate:
    needs: build_docker
    permissions:
      contents: write
    uses: ./.github/workflows/reusable-gate.yml
    with:
      tag: true

  push_docker:
    needs: validate
    permissions:
      packages: write
    uses: ./.github/workflows/reusable-docker.yml
    with:
      push: true

  backmerge_main_to_develop:
    needs: push_docker
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create PR from main to develop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          current_tag=$(git tag --points-at HEAD --sort=creatordate | tail -n1)

          gh pr create \
            --base develop \
            --head main \
            --title "Backmerge main into develop after release ${current_tag}" \
            --body "Automated backmerge PR from \`main\` into \`develop\` after release ${current_tag}."

  create_new_release:
    needs: push_docker
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          current_tag=$(git tag --points-at HEAD --sort=creatordate | tail -n1)

          gh release create "${current_tag}" \
            --title "Release ${current_tag}" \
            --generate-notes \
            --draft

publish_to_pypitest:
  needs: push_docker
  runs-on: ubuntu-latest
  permissions:
    pull-requests: write
  steps:
    - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

    - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

    - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-path: "pyproject.toml"
    - name: Install dependencies
        run: uv sync --extra dev --extra harmony --frozen

    - name: Build package
        run: uv build

    - name: Upload Python artifact
        uses: actions/upload-artifact@v7
        with:
          name: python-artifact
          path: dist/*

    - name: Publish to Test PyPI
        if: steps.check_merge.outputs.is_merge == 'true' && steps.version.outputs.publish == 'true'
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN_TESTPYPI }}
        run: uv publish --publish-url https://test.pypi.org/legacy/